<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 1 – Tailwind</title>
    <!-- Tailwind CSS v4 (browser) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/phosphor-icons@latest/src/css/phosphor.css" />
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-between">

    <header class="max-w-7xl mx-auto px-6 flex-wrap flex-grow">
        <div>
            <!-- LOGO + SLOGAN -->
            <div>
                <h1 class="text-2xl font-bold text-green-900 no-underline">
                    <a href=""
                        title="Instituto Federal de Educação, Ciência e Tecnologia do Estado do Rio Grande do Norte">
                        INSTITUTO FEDERAL
                    </a>
                </h1>
                <p class="hidden md:block slogan">
                    Educação, Ciência, Cultura e Tecnologia em todo o Rio Grande do Norte
                </p>
            </div>
                
                <!-- NAVEGAÇÃO PRINCIPAL (desktop) -->
                <nav class="hidden md:flex flex-wrap items-center gap-3 hover:text-green-500" aria-label="Navegação principal">
                    <a href="https://portal.ifrn.edu.br/processos-seletivos/buscar/">Processos seletivos</a>
                    <a href="https://portal.ifrn.edu.br/cursos/buscar/">Cursos</a>
                    <a href="https://portal.ifrn.edu.br/campus/">Campi</a>
                    <a href="https://portal.ifrn.edu.br/institucional/">Institucional</a>
                    <a href="https://portal.ifrn.edu.br/acesso-a-informacao/">Acesso à Informação</a>
                    <a href="https://portal.ifrn.edu.br/eventos/">Eventos</a>
                    <a href="https://portal.ifrn.edu.br/servicos/">Serviços</a>
                </nav>
            </div>
            <!-- MENU HAMBÚRGUER (mobile) -->
            <button class="text-rose-600 md:hidden" id="menuToggle" aria-label="Menu">
                <i class="ph ph-list">menuToggle</i>
            </button>
                
                
            
            <!-- AÇÕES (ícones, busca, contraste, modo escuro) -->
            <div>
                <!-- Ícones sociais -->
                <ul class=" items-center gap-3">
                    <div class="text-green-500">
                        <a href="#" aria-label="Instagram"><i class="ph ph-instagram-logo"></i></a>
                        <a href="#" aria-label="Twitter"><i class="ph ph-twitter-logo"></i></a>
                        <a href="#" aria-label="LinkedIn"><i class="ph ph-linkedin-logo"></i></a>
                        <a href="#" aria-label="YouTube"><i class="ph ph-youtube-logo"></i></a>
                        <a href="#" aria-label="Spotify"><i class="ph ph-spotify-logo"></i></a>
                        <a href="#" aria-label="TikTok"><i class="ph ph-tiktok-logo"></i></a>
                    </div>
                    
                <!-- Busca -->
                <form method="get" action="/search/">
                    <input class="border rounded-full px-3 py-1 bg-gray-100 focus:outline-none focus:ring" type="search" name="query" placeholder="Busca" aria-label="Busca" />
                    <button type="submit" aria-label="Pesquisar">
                        <i class="ph ph-magnifying-glass"></i>
                    </button>
                </form>

                <!-- Alto contraste -->
                <button id="altocontraste" type="button" aria-label="Alto contraste">
                    <i class="ph ph-contrast"><img src="assets/img/circle-half.svg" alt=""></i>
                </button>

                <!-- Modo escuro -->
                <button type="button" aria-label="Modo escuro">
                    <i class="ph ph-moon"><img src="assets/img/moon.svg" alt=""></i>
                </button>
            </div>
            </ul>
        </div>
    </header>

</body>

</html>
